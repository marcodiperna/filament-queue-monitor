name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12.*', '13.*']
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, intl
          coverage: none
      - name: Install dependencies
        run: composer update --with "laravel/framework:${{ matrix.laravel }}" --prefer-dist --no-interaction --no-progress -W
      - name: Run tests
        run: vendor/bin/phpunit
